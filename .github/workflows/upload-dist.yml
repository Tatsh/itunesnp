jobs:
  upload-dist:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v6.0.3'
      - name: 'Rename binary for release'
        run: 'cp dist/index.js itunesnp'
      - name: 'Upload itunesnp to draft release'
        uses: 'softprops/action-gh-release@v3.0.0'
        with:
          draft: true
          files: 'itunesnp'
name: 'Upload dist'
'on':
  push:
    tags:
      - 'v*'
permissions:
  contents: 'write'
